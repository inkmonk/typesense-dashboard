# Proposed /etc/nginx/sites-enabled/typesense.printo.in
#
# Same as the current file except for the /v1 handling: requests that carry a PIA token are
# checked by the auth service and get the admin or read-only Typesense key injected here.
# The dashboard moves to /dashboard/ (old URL redirects); assets and root redirect keep working.
#
# Needs /etc/nginx/conf.d/typesense-keys.conf (see typesense-keys.conf.example), which
# defines $ts_api_key from $ts_role.

server {
    listen 80;
    server_name typesense.printo.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name typesense.printo.in;

    ssl_certificate /etc/letsencrypt/live/typesense.printo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/typesense.printo.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Typesense API behind PIA ------------------------------------------------------

    # Asks the auth service about the caller's PIA token. Only used by auth_request below.
    location = /_ts_auth {
        internal;
        proxy_pass http://127.0.0.1:9100/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    location /v1/ {
        # LEGACY, remove once everyone signs in through PIA: a request with no Authorization
        # header keeps using the x-typesense-api-key it sends, exactly as before.
        if ($http_authorization = "") {
            rewrite ^/v1/(.*)$ /_ts_legacy/$1 last;
        }

        # 401 / 403 from the auth service are returned to the client as they are; anything else
        # (PIA unreachable) becomes a 500. Either way the request never reaches Typesense.
        auth_request /_ts_auth;
        auth_request_set $ts_role $upstream_http_x_role;

        # Always replace whatever key the client sent, and keep the PIA token away from Typesense.
        proxy_set_header X-TYPESENSE-API-KEY $ts_api_key;
        proxy_set_header Authorization "";

        proxy_pass http://127.0.0.1:8108/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LEGACY path for the block above: the client's own key passes through untouched.
    location /_ts_legacy/ {
        internal;
        proxy_pass http://127.0.0.1:8108/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # ---- Dashboard ---------------------------------------------------------

    # The dashboard lives at /dashboard/. The old /typesense-dashboard/ URL redirects there
    # (keeping the rest of the path) so bookmarks and tabs open on the old build still work.
    location = /dashboard {
        return 301 /dashboard/;
    }

    # Missing files under assets/ must be a real 404, not the HTML page.
    location /dashboard/assets/ {
        alias /home/ubuntu/typesense-dashboard/dist/spa/assets/;
        try_files $uri =404;
    }

    # Clean URLs (/dashboard/collections): anything that is not a file serves the app. In an
    # `alias` location the fallback must name the full URL, /dashboard/index.html, not /index.html.
    location /dashboard/ {
        alias /home/ubuntu/typesense-dashboard/dist/spa/;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }

    location = /typesense-dashboard {
        return 301 /dashboard/;
    }

    location /typesense-dashboard/ {
        rewrite ^/typesense-dashboard/(.*)$ /dashboard/$1 permanent;
    }

    location /assets/ {
        alias /home/ubuntu/typesense-dashboard/dist/spa/assets/;
    }

    location /icons/ {
        alias /home/ubuntu/typesense-dashboard/dist/spa/icons/;
    }

    location = /favicon.ico {
        alias /home/ubuntu/typesense-dashboard/dist/spa/favicon.ico;
    }

    location = / {
        return 302 /dashboard/;
    }
}
