# /etc/nginx/sites-enabled/typesense.printo.in  (dashboard paths only; the API is unchanged)
#
# Your current file with three differences: the dashboard is served at /dashboard/ (clean URLs),
# the old /typesense-dashboard/ address redirects there, and /pia/ forwards to PIA. The /v1 API
# block is exactly as it is today. The PIA gateway version of this file lives in the gateway PR.
#
# Apply with the steps in deploy/README.md (backup first; nginx -t before reload).

server {
    listen 80;
    server_name typesense.printo.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name typesense.printo.in;

    ssl_certificate /etc/letsencrypt/live/typesense.printo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/typesense.printo.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Typesense API (unchanged)
    location /v1 {
        proxy_pass http://127.0.0.1:8108/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # PIA (sign-in), reached on this same host so the browser makes no cross-origin call.
    # PIA's own CORS preflight carries two Access-Control-Allow-Origin values, which browsers
    # reject. The resolver makes nginx look pia.printo.in up again instead of keeping the
    # address it saw at startup.
    location /pia/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $pia_upstream pia.printo.in;
        rewrite ^/pia/(.*)$ /$1 break;
        proxy_pass https://$pia_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host pia.printo.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard at /dashboard/
    location = /dashboard {
        return 301 /dashboard/;
    }

    # Missing files under assets/ must be a real 404, not the HTML page.
    location /dashboard/assets/ {
        alias /home/ubuntu/typesense-dashboard/dist/spa/assets/;
        try_files $uri =404;
    }

    # Clean URLs (/dashboard/collections): anything that is not a file serves the app. In an
    # `alias` location the fallback must name the full URL, /dashboard/index.html.
    location /dashboard/ {
        alias /home/ubuntu/typesense-dashboard/dist/spa/;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # Old address: bookmarks and tabs open on the old build keep working.
    location = /typesense-dashboard {
        return 301 /dashboard/;
    }

    location /typesense-dashboard/ {
        rewrite ^/typesense-dashboard/(.*)$ /dashboard/$1 permanent;
    }

    # Root-level assets and icons: only the previous build (base path "/") asked for these.
    location /assets/ {
        alias /home/ubuntu/typesense-dashboard/dist/spa/assets/;
    }

    location /icons/ {
        alias /home/ubuntu/typesense-dashboard/dist/spa/icons/;
    }

    location = /favicon.ico {
        alias /home/ubuntu/typesense-dashboard/dist/spa/favicon.ico;
    }

    location = / {
        return 302 /dashboard/;
    }
}
